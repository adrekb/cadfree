[project]
name = "cadfree"
version = "0.1.0"
description = "Cursor-style CAD agent that refuses parts your shop cannot actually make."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "sqlalchemy>=2.0.36",
    "pydantic>=2.10.0",
    "httpx>=0.27.0",
    "numpy>=2.0.0",
    "trimesh>=4.5.0",
    "python-multipart>=0.0.12",
]

[project.optional-dependencies]
cad = [
    "cadquery>=2.4.0",
]
physics = [
    "sympy>=1.13",
    "scipy>=1.11",
]
dev = [
    "pytest>=8.3.0",
    "ruff>=0.8.0",
]

[project.scripts]
cadfree = "cadfree.main:run"

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["cadfree*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"
